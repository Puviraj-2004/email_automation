services:
  postgres:
    image: postgres:16-alpine
    container_name: email_automation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_automation
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d email_automation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
